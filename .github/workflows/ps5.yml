name: PS5 Build and Release

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pacbrew-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ps5-payload-dev/pacbrew-repo
          ref: 19718edd6fd5e9447f38b7fb59ebbacc136b5421
          path: pacbrew-repo
          persist-credentials: false

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf \
            automake \
            build-essential \
            clang-18 \
            cmake \
            curl \
            git \
            libarchive-tools \
            libtool \
            lld-18 \
            makepkg \
            meson \
            pacman-package-manager \
            pkg-config \
            python3
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Build PS5 payload SDK
        working-directory: pacbrew-repo/sdk
        run: |
          makepkg -c -f
          shopt -s nullglob
          packages=(./ps5-payload-sdk-*.pkg.tar.*)
          (( ${#packages[@]} == 1 )) || {
            printf 'expected one payload SDK package, found %d\n' "${#packages[@]}" >&2
            exit 1
          }
          sudo pacman --noconfirm -U "${packages[0]}"

      - name: Build PS5 libc++ headers
        working-directory: pacbrew-repo/libcxx
        run: |
          makepkg -c -f
          shopt -s nullglob
          packages=(./ps5-payload-libcxx-*.pkg.tar.*)
          (( ${#packages[@]} == 1 )) || {
            printf 'expected one payload libc++ package, found %d\n' "${#packages[@]}" >&2
            exit 1
          }
          sudo pacman --noconfirm -U "${packages[0]}"

      - name: Build and verify runtime variants
        run: |
          rm -rf -- \
            out/payload-sdk-loose-stdio \
            out/payload-sdk-packed-stdio \
            out/payload-sdk-variants
          make runtime-variants PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk

      - name: Upload runtime variants
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libSceAmpr-runtime-variants
          path: |
            out/payload-sdk-variants/*.prx
            out/payload-sdk-variants/*.sprx
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    permissions:
      actions: read
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libSceAmpr-runtime-variants
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.sprx
          fail_on_unmatched_files: true
